name = "hawk_gleam"
version = "1.0.0"
gleam = ">= 1.11.0"
licences = ["AGPL-3.0-only"]
description = "Hawk.so error catcher for Gleam applications on the Erlang VM"
target = "erlang"

repository = { type = "github", user = "Dobrunia", repo = "hawk.gleam" }
links = [
  { title = "Hawk", href = "https://hawk.so" },
  { title = "Catchers", href = "https://docs.hawk.so/catchers" },
]

# Public API is `hawk_gleam`. Everything else is implementation.
internal_modules = [
  "catcher",
  "event",
  "transport",
  "utils/*",
]

[dependencies]
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_http = ">= 4.3.0 and < 5.0.0"
gleam_httpc = ">= 5.0.0 and < 6.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
gleam_otp = ">= 1.3.0 and < 2.0.0"
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
typeid_gleam = ">= 1.1.0 and < 2.0.0"

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"

name = "hawk_gleam_old"
version = "1.0.0"
gleam = ">= 1.11.0"
target = "erlang"
description = "Previous hawk_gleam implementation, used only for load-test comparison"

internal_modules = [
  "otp/*",
  "transport",
  "utils/*",
]

[dependencies]
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_http = ">= 4.3.0 and < 5.0.0"
gleam_httpc = ">= 5.0.0 and < 6.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
gleam_otp = ">= 1.3.0 and < 2.0.0"
gleam_stdlib = ">= 1.0.0 and < 2.0.0"

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
